name: NetBox CI/CD Pipeline

on:
  push:
    branches: [ main, test-ci-failure ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Lint & Docker Compose Validate
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

  deploy-and-test:
    name: Integration Test & Healthcheck
    needs: lint-and-validate
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - name: Ensure clean workspace
        run: docker compose down -v || true

      - name: Start PostgreSQL and Redis
        run: docker compose up -d postgres redis

      - name: Wait for PostgreSQL readiness
        run: |
          for i in {1..30}; do
            if docker compose exec postgres pg_isready -U netbox -d netbox; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 2
          done

      - name: Start NetBox and Monitoring stack
        run: docker compose up -d

      - name: Wait for NetBox Healthcheck (HTTP 200/302)
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || true)
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "NetBox is healthy!"
              exit 0
            fi
            sleep 4
          done
          echo "Healthcheck failed! Showing NetBox logs:"
          docker compose logs --tail=50 netbox
          exit 1

      - name: Cleanup containers
        if: always()
        run: docker compose down -v
