name: NetBox CI/CD Pipeline

on:
  push:
    branches: [ main, test-ci-failure ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Lint & Docker Compose Validate
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

  deploy-and-test:
    name: Integration Test & Healthcheck
    needs: lint-and-validate
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - name: Start NetBox stack
        run: docker compose up -d

      - name: Wait for NetBox Healthcheck (HTTP 200/302)
        run: |
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || true)
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "NetBox is healthy!"
              exit 0
            fi
            sleep 3
          done
          echo "Healthcheck failed!"
          exit 1
